services:
  backend:
    build: .
    container_name: smartcampus_backend
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_ENV=${APP_ENV:-development}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3