name: CI/CD SmartCampus

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_quality:
    name: Pruebas y Calidad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Etapa 1 - Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Etapa 2 - Instalación
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt black

      - name: Etapa 3 - Calidad
        run: black --check app/ tests/

      - name: Etapa 4 - Tests
        run: python -m pytest

  build_and_deploy:
    name: Construcción y Despliegue
    needs: test_and_quality
    runs-on: ubuntu-latest

    steps:
      - name: Etapa 1 - Checkout
        uses: actions/checkout@v4

      - name: Etapa 5 - Build Docker
        run: docker build -t smartcampus:latest .

      - name: Etapa 6 - Validación
        run: |
          # Levantar el contenedor temporalmente para validar
          docker run -d -p 5000:5000 --name test_backend smartcampus:latest
          sleep 5
          # Hacer ping al endpoint de salud
          curl -f http://localhost:5000/health
          # Detener el contenedor
          docker stop test_backend

      - name: Etapa 7 - Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Iniciando proceso de despliegue..."
          if [ -z "$DB_PASSWORD" ]; then
            echo "⚠️ Aviso: El secreto DB_PASSWORD no está configurado en GitHub."
          else
            echo "✅ Secreto detectado de forma segura."
          fi
          echo "Despliegue simulado finalizado."